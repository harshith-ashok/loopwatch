<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a left rail of pages (as in SAGE) and one panel per signal source (as in PersonaLens).
   Incidents read as a five-stage loop: detect, investigate, decide, act, verify. */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --line:#DADEE6; --line-strong:#C3C9D4;
  --fg:#141A24; --muted:#586376; --faint:#8791A3;
  --accent:#3552D6; --accent-soft:#E3E8FB; --accent-fg:#FFFFFF;
  --ok:#0F6F4A; --ok-soft:#DDF3E9; --warn:#8A5600; --warn-soft:#FBEBC8; --crit:#C63540; --crit-soft:#FADDDF;
  --font-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0E15; --surface:#101723; --surface-2:#16202F; --line:#223046; --line-strong:#304059;
    --fg:#E5E9F1; --muted:#93A0B5; --faint:#66748B;
    --accent:#8AA2FF; --accent-soft:#1C2748; --accent-fg:#0A0E15;
    --ok:#4BD6A0; --ok-soft:#0F2E26; --warn:#F0B85A; --warn-soft:#33260E; --crit:#FF7B82; --crit-soft:#371A1E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#101723; --surface-2:#16202F; --line:#223046; --line-strong:#304059;
  --fg:#E5E9F1; --muted:#93A0B5; --faint:#66748B;
  --accent:#8AA2FF; --accent-soft:#1C2748; --accent-fg:#0A0E15;
  --ok:#4BD6A0; --ok-soft:#0F2E26; --warn:#F0B85A; --warn-soft:#33260E; --crit:#FF7B82; --crit-soft:#371A1E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol,dl,dd,pre{margin:0}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:14px;font-weight:600}
h3{font-size:13px;font-weight:600;margin-top:14px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .nowrap{white-space:nowrap}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column;gap:22px;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--fg);padding:0 6px}
.brand svg{color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--muted);text-align:left;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.count{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;font-size:11.5px;font-weight:600;padding:0 7px;min-width:20px;text-align:center}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.hint{color:var(--muted);font-size:12.5px;text-wrap:pretty}
.main{padding:22px clamp(16px,3vw,32px) 56px;min-width:0}
.view{display:flex;flex-direction:column;gap:16px;max-width:1200px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);margin-top:4px;max-width:62ch}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card,.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.kpi .k{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:26px;font-weight:500;line-height:1.25}
.kpi .v small{font-size:14px;color:var(--faint);margin-left:2px}
.kpi .s{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.pill{cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-weight:500}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.empty{color:var(--muted)}
.rows{list-style:none;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}
.rows .nm{display:flex;flex-direction:column;min-width:0}
.rows .nm span{color:var(--muted);font-size:12.5px}
.spark .sl{fill:none;stroke:var(--c);stroke-width:1.5;stroke-linejoin:round}
.spark .sa{fill:var(--c);opacity:.12}
.spark .sd{fill:var(--c)}
.spark.acc{--c:var(--accent)} .spark.ok{--c:var(--ok)} .spark.warn{--c:var(--warn)} .spark.crit{--c:var(--crit)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;list-style:none;padding:0;margin:14px 0 4px}
.steps i{display:block;height:4px;border-radius:2px;background:var(--line)}
.steps span{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.steps .done i{background:var(--ok)}
.steps .active i{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.steps .wait i{background:var(--warn);animation:pulse 1.4s ease-in-out infinite}
.steps .fail i{background:var(--crit)}
.steps .active span,.steps .wait span,.steps .fail span{color:var(--fg);font-weight:500}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.steps i{animation:none!important}.toast{animation:none!important}}
.now{color:var(--muted);margin-top:8px;text-wrap:pretty}
.inc-t{margin:0 0 8px;font-weight:500}
.inj{display:grid;gap:8px}
.inj-btn{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.inj-btn:hover:not(:disabled){background:var(--surface-2)}
.inj-btn strong{display:block;font-weight:500}
.inj-btn small{display:block;color:var(--muted);font-size:12.5px}
.inj-btn svg{flex:none;color:var(--accent)}
.inj-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.inj-foot label{display:flex;align-items:center;gap:8px;color:var(--muted)}
select,.num-in{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px}
.num-in{width:72px}
.feed{list-style:none;padding:0;max-height:340px;overflow:auto}
.feed li{display:grid;grid-template-columns:62px 76px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.feed li:first-child{border-top:0}
.t{color:var(--muted);font-size:12.5px}
.tag{font-size:12px;font-weight:500;color:var(--muted)}
.tag.ok{color:var(--ok)} .tag.warn,.tag.human{color:var(--warn)} .tag.crit{color:var(--crit)} .tag.agent{color:var(--accent)}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:2px;padding:8px}
.li{display:flex;flex-direction:column;gap:5px;text-align:left;padding:10px;border:0;border-radius:8px;background:none}
.li:hover{background:var(--surface-2)}
.li.on{background:var(--accent-soft)}
.li strong{font-weight:500}
.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.inc-h{font-size:19px;font-weight:600;margin:8px 0 12px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px}
.meta dt{color:var(--muted);font-size:12.5px}
.meta dd{margin:0;font-weight:500}
.signals{margin:12px 0 0;padding-left:18px;color:var(--muted)}
.approve{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.approve-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--warn)}
.approve p{color:var(--fg)}
.tl{list-style:none;padding:0}
.tl li{display:grid;grid-template-columns:50px 10px minmax(0,1fr);gap:10px;padding:6px 0;align-items:baseline}
.tl li i{width:8px;height:8px;border-radius:50%;background:var(--kc,var(--faint));align-self:center}
.tl .k-detect{--kc:var(--crit)} .tl .k-agent{--kc:var(--accent)} .tl .k-policy,.tl .k-human{--kc:var(--warn)}
.tl .k-executor{--kc:var(--accent)} .tl .k-verifier,.tl .k-ok{--kc:var(--ok)} .tl .k-fail{--kc:var(--crit)}
.tl .k-harness{color:var(--muted)}
.hyps{list-style:none;padding:0;display:flex;flex-direction:column;gap:14px}
.hyp-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--faint)}
.bar i.top{background:var(--accent)}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--font-mono);font-size:11.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--line-strong);color:var(--muted)}
.chip.pos{color:var(--ok);border-color:var(--ok)} .chip.neg{color:var(--crit);border-color:var(--crit)}
.trace-btn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-weight:500;margin-bottom:10px}
.trace-btn svg{transition:transform .15s}
.trace-btn.open svg{transform:rotate(180deg)}
.calls{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.call-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
code.call{display:block;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:5px 8px;overflow-x:auto;white-space:nowrap}
.calls p{margin-top:4px}
.acts,.ver{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.acts li{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.acts li:last-child{border-bottom:0;padding-bottom:0}
.act-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ver{gap:8px}
.ver li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.jsteps{list-style:none;padding:0;margin:12px 0}
.jsteps li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.jsteps .si{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.jsteps .bad .si{background:var(--crit)} .jsteps .skip .si{background:var(--line-strong)}
.jsteps .bad .ms{color:var(--crit)} .jsteps .skip .ms{color:var(--faint)}
.jsteps .sn small{display:block;color:var(--muted);font-size:12px}
.jfoot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tchart{width:100%;height:auto;display:block}
.tchart text{fill:var(--muted);font-size:11px;font-family:var(--font-mono)}
.tchart .gl{stroke:var(--line);stroke-width:1}
.tchart .lim{stroke:var(--crit);stroke-width:1;stroke-dasharray:4 4}
.tchart text.limt{fill:var(--crit)}
.tchart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.tchart .dt{fill:var(--accent)}
.code{font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;margin-bottom:10px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.ctrl{display:flex;flex-direction:column;gap:14px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:16px}
.switch-row small{display:block;color:var(--muted);font-size:12.5px}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line-strong);transition:background .15s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.filters{margin-bottom:0}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;width:min(360px,calc(100vw - 32px))}
.toast{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);box-shadow:0 6px 24px rgba(0,0,0,.18);animation:rise .2s ease-out}
.toast strong{font-weight:600}
.toast span{color:var(--muted);font-size:13px}
.toast.crit{border-color:var(--crit)} .toast.warn{border-color:var(--warn)} .toast.ok{border-color:var(--ok)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}.list{flex-direction:row;overflow-x:auto}.li{min-width:220px}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{flex-direction:row;gap:4px}
  .nav button{white-space:nowrap}
  .rail-foot{display:none}
  .brand{flex:none}
}
@media (max-width:560px){
  .rows li{grid-template-columns:minmax(0,1fr) auto auto}
  .rows .spark{display:none}
  .feed li{grid-template-columns:58px minmax(0,1fr)}
  .feed .tag{display:none}
}
</style>

<body>
<div id="app"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const API = { mode: 'simulator', base: '/api/v1' }; // swap run() for an EventSource on `${API.base}/events` to drive this UI from FastAPI
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const p2 = n => String(n).padStart(2, '0');
const hms = (d = new Date()) => `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const rel = s => s == null ? '—' : `+${Math.floor(s / 60)}:${p2(Math.floor(s % 60))}`;
const secs = s => s == null ? '—' : (s < 10 ? s.toFixed(1) : String(Math.round(s))) + ' s';
const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
const dur = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d} d ${h} h` : h ? `${h} h ${m} m` : `${m} m`; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
let uid = 0;
let queued = false;

/* ---------- synthetic journeys (one panel per signal source) ---------- */
const JDEF = [
  { id: 'login', name: 'Login', via: 'Browser flow', base: 420, steps: [['Open login page', 'shop-web', .38], ['Submit credentials', 'auth-api', .37], ['Session cookie set', 'auth-api', .25]] },
  { id: 'checkout', name: 'Checkout', via: 'Browser flow', base: 900, steps: [['Add item to cart', 'shop-api', .3], ['Review cart', 'shop-api', .25], ['Create order', 'shop-api → payments-primary', .45]] },
  { id: 'payment', name: 'Payment', via: 'API probe', base: 1100, steps: [['Authorize card', 'payments-primary', .4], ['Capture payment', 'payments-primary', .35], ['Webhook received', 'payments-webhook', .25]] },
  { id: 'order', name: 'Order confirmation', via: 'API probe', base: 780, steps: [['Order created', 'order-worker', .3], ['Status is confirmed', 'order-worker', .35], ['Hub acknowledges', 'fulfillment-hub-01', .35]] }
];
function makeJourney(d) {
  return {
    id: d.id, name: d.name, via: d.via, base: d.base, mode: 'ok', failStep: -1, slow: null, lastRun: hms(),
    steps: d.steps.map(([name, svc, share]) => ({ name, svc, name0: name, svc0: svc, share, ok: true, ms: Math.round(d.base * share) })),
    history: Array.from({ length: 40 }, () => Math.round(d.base * rnd(.92, 1.08)))
  };
}
function probe(j) {
  let total = 0;
  j.steps.forEach((s, i) => {
    const nominal = j.base * s.share * rnd(.92, 1.08);
    if (j.mode === 'fail' && i === j.failStep) { s.ok = false; s.ms = null; total += 5000; }
    else if (j.mode === 'fail' && i > j.failStep) { s.ok = null; s.ms = null; }
    else if (j.mode === 'slow' && i === j.failStep && j.slow) {
      if (Math.random() < j.slow.rate) { s.ok = false; s.ms = null; total += 5000; }
      else { s.ok = true; s.ms = Math.round(rnd(j.slow.lo, j.slow.hi)); total += s.ms; }
    } else { s.ok = true; s.ms = Math.round(nominal); total += s.ms; }
  });
  j.lastRun = hms(); j.history.push(Math.round(total)); if (j.history.length > 40) j.history.shift();
}
const jStatus = j => j.mode === 'fail' ? 'failed' : j.mode === 'slow' ? 'degraded' : 'ok';
const J = id => S.journeys.find(j => j.id === id);

/* ---------- policy: what the agent may do on its own ---------- */
const ACTIONS = {
  retry_operation: { name: 'Retry failed operation', risk: 'low', mode: 'auto', rollback: 'None needed, retries are idempotent' },
  switch_endpoint: { name: 'Switch to fallback endpoint', risk: 'medium', mode: 'auto', rollback: 'Switch back once the primary passes a health check' },
  restart_service: { name: 'Restart simulated service', risk: 'medium', mode: 'auto', rollback: 'Redeploy the previous container revision' },
  open_ticket: { name: 'Open incident ticket', risk: 'low', mode: 'auto', rollback: 'Close the ticket with a note' },
  power_cycle_device: { name: 'Power-cycle edge device', risk: 'high', mode: 'approval', rollback: 'Restore the previous device profile and route acks to the manual queue' }
};
const savedP = lsGet('loopwatch.policy', {});
const P = {
  killSwitch: !!savedP.killSwitch,
  budget: savedP.budget || 3,
  modes: Object.assign(Object.fromEntries(Object.entries(ACTIONS).map(([k, v]) => [k, v.mode])), savedP.modes || {})
};
const savePolicy = () => lsSet('loopwatch.policy', P);
const modeFor = type => P.modes[type] === 'blocked' ? 'blocked' : (P.killSwitch ? 'approval' : P.modes[type]);
const RISK = { low: 0, medium: 1, high: 2 };

function metrics() {
  const done = S.incidents.filter(i => ['resolved', 'mitigated', 'escalated', 'false_positive'].includes(i.status));
  const real = done.filter(i => !i.falsePositive);
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return {
    n: done.length, real: real.length, detect: mean(real.map(i => i.detectLatency)),
    rca: real.length ? real.filter(i => i.rcaCorrect).length / real.length : null,
    rec: real.length ? real.filter(i => i.recovered).length / real.length : null,
    fp: done.length ? done.filter(i => i.falsePositive).length / done.length : null,
    mttr: mean(real.filter(i => i.recovered).map(i => i.mttr))
  };
}

  return `<section class="view">${head('Policies', 'What the agent may do on its own. Changes apply to the next incident and are saved in this browser.')}
  <div class="card ctrl">
    <label class="switch-row"><span><strong>Pause autonomous actions</strong><small>Every action waits for a person, whatever its mode.</small></span><span class="switch"><input id="kill" type="checkbox" data-chg="kill"${P.killSwitch ? ' checked' : ''}><i></i></span></label>
    <label class="switch-row"><span><strong>Action budget per incident</strong><small>After this many actions the incident escalates.</small></span><input id="budget" class="num-in mono" type="number" min="1" max="6" value="${P.budget}" data-chg="budget"></label>
  </div>
  <div class="card scroll"><table class="tbl"><thead><tr><th>Action</th><th>Risk</th><th>Mode</th><th>Rollback plan</th></tr></thead><tbody>
    ${Object.entries(ACTIONS).map(([k, d]) => `<tr><td><strong>${d.name}</strong><div class="muted small mono">${k}</div></td><td>${pill(d.risk, riskTone(d.risk))}</td><td><select id="mode-${k}" data-chg="mode" data-key="${k}" aria-label="Mode for ${d.name}">${[['auto', 'Auto'], ['approval', 'Needs approval'], ['blocked', 'Blocked']].map(([v, l]) => `<option value="${v}"${P.modes[k] === v ? ' selected' : ''}>${l}</option>`).join('')}</select></td><td>${d.rollback}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="hint">Try it: set "Restart simulated service" to Needs approval, then stall the order queue.</p></section>`;
}
function pAudit() {
  const rows = S.audit.filter(e => S.auditFilter === 'all' || e.actor === S.auditFilter);
  return `<section class="view">${head('Audit log', 'Every detection, decision, approval and action, with who did it. Saved in this browser.', `<button class="btn" data-act="clearAudit">Clear log</button>`)}
  <div class="pills filters">${['all', 'detector', 'agent', 'policy', 'human', 'executor', 'verifier'].map(f => `<button class="pill${S.auditFilter === f ? ' acc' : ''}" data-act="filter" data-arg="${f}">${f}</button>`).join('')}</div>
  <div class="card scroll"><table class="tbl"><thead><tr><th>Time</th><th>Actor</th><th>Incident</th><th>Event</th></tr></thead><tbody>
    ${rows.length ? rows.map(e => `<tr><td class="mono nowrap">${fmtTs(e.ts)}</td><td>${pill(e.actor)}</td><td>${e.inc ? `<button class="link mono" data-act="openInc" data-arg="${e.inc}">${e.inc}</button>` : ''}</td><td>${esc(e.text)} ${e.demo ? pill('Sample') : ''}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No entries.</td></tr>'}
  </tbody></table></div></section>`;
}
function pScore() {
  const m = metrics(), cards = [['Detection latency', secs(m.detect), 'Fault injected to incident opened'], ['Root-cause accuracy', pct(m.rca), 'Top hypothesis matches the injected fault'], ['Recovery success', pct(m.rec), 'Journey verified healthy after recovery'], ['False-positive rate', pct(m.fp), 'Incidents opened with no real fault'], ['Mean time to resolve', secs(m.mttr), 'Fault injected to verified recovery']];
  return `<section class="view">${head('Scorecard', 'Computed from every incident on this page: the sample history plus any runs you trigger.')}
  <div class="grid kpis">${cards.map(c => `<div class="kpi"><span class="k">${c[0]}</span><span class="v mono">${c[1]}</span><span class="s">${c[2]}</span></div>`).join('')}</div>
  <div class="card scroll"><h2 style="margin-bottom:8px">Incidents</h2><table class="tbl"><thead><tr><th>Incident</th><th>Title</th><th>Detected after</th><th>Root cause</th><th>Outcome</th><th>Time to resolve</th></tr></thead><tbody>
  ${S.incidents.map(i => `<tr><td><button class="link mono" data-act="openInc" data-arg="${i.id}">${i.id}</button></td><td>${esc(i.title)} ${i.demo ? pill('Sample') : ''}</td><td class="mono">${secs(i.detectLatency)}</td><td>${i.rcaCorrect == null ? '—' : pill(i.rcaCorrect ? 'Correct' : 'Missed', i.rcaCorrect ? 'ok' : 'crit')}</td><td>${pill(stat(i.status)[0], stat(i.status)[1])}</td><td class="mono">${i.mttr != null ? secs(i.mttr) : '—'}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="card"><h2 style="margin-bottom:6px">Baselines</h2><p class="muted">Not measured yet. Run the same fault scenarios with "alert only" and with "blind retry or restart", then add those results here to show what the agent adds.</p></div>
  <p class="hint">Times use the simulator's clock, not wall time. Sample incidents are example history so the numbers are not empty.</p></section>`;
}
const NAV = [['overview', 'Overview', 'grid'], ['incidents', 'Incidents', 'alert'], ['journeys', 'Journeys', 'activity'], ['edge', 'Edge node', 'cpu'], ['policies', 'Policies', 'shield'], ['audit', 'Audit log', 'list'], ['score', 'Scorecard', 'bars']];
const PAGES = { overview: pOverview, incidents: pIncidents, journeys: pJourneys, edge: pEdge, policies: pPolicies, audit: pAudit, score: pScore };
function view() {
  const oc = openCount();
  return `<div class="app"><aside class="rail"><div class="brand">${LOGO}<span>Loopwatch</span></div>
    <nav class="nav" aria-label="Pages">${NAV.map(([k, l, i]) => `<button data-act="go" data-arg="${k}" class="${S.view === k ? 'on' : ''}"${S.view === k ? ' aria-current="page"' : ''}>${ic(i)}<span>${l}</span>${k === 'incidents' && oc ? `<span class="count">${oc}</span>` : ''}</button>`).join('')}</nav>
    <div class="rail-foot"><span class="pill"><i class="dot"></i>Simulator mode</span><p class="hint">No backend connected. Faults and agent steps are scripted in this page.</p></div></aside>
    <main class="main">${PAGES[S.view]()}</main></div>
    <div class="toasts" aria-live="polite">${S.toasts.map(t => `<button class="toast ${t.kind}" data-act="toast" data-arg="${esc(t.inc || '')}"><strong>${esc(t.title)}</strong><span>${esc(t.text)}</span></button>`).join('')}</div>`;
}

/* ---------- rendering: morph the live DOM so focus, clicks and scroll survive each tick ---------- */
const root = document.getElementById('app');
function morphKids(a, b) {
  const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes), n = Math.max(ac.length, bc.length);
  for (let i = 0; i < n; i++) { if (!ac[i]) a.appendChild(bc[i]); else if (!bc[i]) a.removeChild(ac[i]); else morph(ac[i], bc[i]); }
}
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType !== 1) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  const tag = a.nodeName;
  if (tag === 'INPUT') { if (a.type === 'checkbox') a.checked = b.hasAttribute('checked'); else if (document.activeElement !== a) a.value = b.getAttribute('value') || ''; }
  morphKids(a, b);
  if (tag === 'SELECT' && document.activeElement !== a) { const s = b.querySelector('option[selected]'); if (s) a.value = s.getAttribute('value'); }
}
function render() { const b = document.createElement('div'); b.innerHTML = view(); morphKids(root, b); }
function invalidate() { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; render(); }); }

/* ---------- events ---------- */
const go = k => { S.view = k; window.scrollTo(0, 0); invalidate(); };
const openInc = id => { S.sel = id; S.view = 'incidents'; window.scrollTo(0, 0); invalidate(); };
const ACT = {
  go, openInc, run, reset,
  decide: a => decide(a === 'yes'),
  selInc: id => { S.sel = id; invalidate(); },
  toggleTrace: () => { S.traceOpen = !S.traceOpen; invalidate(); },
  probe: id => { const j = J(id); probe(j); feed('info', `Manual run of "${j.name}": ${jLabel(j).toLowerCase()}`); },
  filter: f => { S.auditFilter = f; invalidate(); },
  clearAudit: () => { S.audit.length = 0; lsSet('loopwatch.audit', S.audit); invalidate(); },
  toast: id => { if (id) openInc(id); }
};
const CHG = {
  pace: t => { S.pace = +t.value; invalidate(); },
  kill: t => { P.killSwitch = t.checked; savePolicy(); log('human', 'Autonomous actions ' + (P.killSwitch ? 'paused' : 'resumed')); },
  budget: t => { P.budget = Math.min(6, Math.max(1, parseInt(t.value, 10) || 1)); savePolicy(); log('human', 'Action budget set to ' + P.budget); },
  mode: t => { P.modes[t.dataset.key] = t.value; savePolicy(); log('human', `${ACTIONS[t.dataset.key].name} set to ${t.value}`); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const f = ACT[t.dataset.act]; if (f) f(t.dataset.arg); });
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); });

render();
</script>
